# HP OMEN AI-workload cooling profile.
# Temperatures are Celsius; fan values are percentages of the firmware table.
# Ordered points are interpolated linearly. Add close upper points for a
# sharper climb, or space points evenly for a linear response.
fan_curve=32:5,45:50,70:50,76:70,82:100
target_temp_c=70

# Enter manual cooling when any active threshold is met. Return to firmware
# automatic control only after all idle thresholds and the hold have cleared.
active_temp_c=45
idle_temp_c=35
active_util_percent=5
active_clock_mhz=500
active_fan_floor=50
active_hold_multiplier=3

# Sustained AI workload detection and gradual heat-soak compensation.
workload_util_percent=30
workload_power_w=45
workload_clock_mhz=1000
soak_after_s=120
soak_step_s=120
soak_step_percent=5
soak_max_bias_percent=25
soak_gap_hold_s=90
soak_decay_s=600

# Thermal safety. A warning is rate-limited; two consecutive critical samples
# request maximum cooling and latch the GPU unlock off.
warning_temp_c=80
warning_fan_percent=90
unlock_disable_temp_c=85
critical_samples=2
warning_repeat_s=300

# Maximum percentage-point movement per four-second control tick.
ramp_up_step=20
ramp_down_step=5
